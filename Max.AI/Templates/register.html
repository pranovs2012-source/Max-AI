<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Max AI - Register</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000010;overflow:hidden;width:100vw;height:100vh;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;}
.form-wrapper{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;}
.brand{text-align:center;margin-bottom:12px;}
.brand h1{font-size:28px;font-weight:700;letter-spacing:4px;background:linear-gradient(135deg,#ff6a00,#cc44ff,#00ccff);background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;}
.brand p{font-size:12px;color:rgba(200,160,255,0.5);letter-spacing:2px;margin-top:4px;}
.card{background:rgba(8,4,20,0.88);border:1px solid rgba(180,80,255,0.25);border-radius:18px;padding:32px 40px;width:380px;backdrop-filter:blur(12px);box-shadow:0 0 60px rgba(140,40,255,0.15),0 0 120px rgba(255,80,0,0.05);animation:fadeUp 0.8s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.card h2{color:rgba(220,180,255,0.9);font-size:18px;font-weight:500;text-align:center;margin-bottom:22px;letter-spacing:2px;}
.error-msg{background:rgba(255,50,50,0.1);border:1px solid rgba(255,50,50,0.3);border-radius:8px;padding:10px 14px;color:#ff8888;font-size:13px;margin-bottom:14px;text-align:center;}
.success-msg{background:rgba(50,255,100,0.1);border:1px solid rgba(50,255,100,0.3);border-radius:8px;padding:10px 14px;color:#88ffaa;font-size:13px;margin-bottom:14px;text-align:center;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:rgba(200,160,255,0.6);letter-spacing:1px;margin-bottom:5px;}
.field input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(180,80,255,0.2);border-radius:10px;padding:11px 16px;color:#e8d5ff;font-size:14px;outline:none;transition:border-color 0.3s,background 0.3s,box-shadow 0.3s;}
.field input:focus{border-color:rgba(180,80,255,0.6);background:rgba(180,80,255,0.06);box-shadow:0 0 0 3px rgba(180,80,255,0.1);}
.field input::placeholder{color:rgba(180,130,220,0.3);}
.btn-register{width:100%;background:linear-gradient(135deg,#006688,#8800cc);border:none;border-radius:10px;padding:13px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:1px;margin-top:6px;transition:opacity 0.2s,transform 0.1s;position:relative;overflow:hidden;}
.btn-register:hover{opacity:0.88;}
.btn-register:active{transform:scale(0.98);}
.btn-register::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);animation:shimmer 2s infinite;}
@keyframes shimmer{to{left:100%;}}
.footer-link{text-align:center;margin-top:18px;font-size:13px;color:rgba(180,130,220,0.5);}
.footer-link a{color:#cc66ff;text-decoration:none;font-weight:500;}
.footer-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="form-wrapper">
  <div class="brand">
    <h1>Max AI</h1>
    <p>Join the Dragon Realm</p>
  </div>
  <div class="card">
    <h2>&#9670; CREATE ACCOUNT &#9670;</h2>
    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
    {% if success %}<div class="success-msg">{{ success }} <a href="/login" style="color:#cc66ff;">Login now</a></div>{% endif %}
    <form method="POST" action="/register">
      <div class="field">
        <label>EMAIL ADDRESS</label>
        <input type="email" name="email" placeholder="your@email.com" required />
      </div>
      <div class="field">
        <label>PASSWORD</label>
        <input type="password" name="password" placeholder="Min 6 characters" required />
      </div>
      <div class="field">
        <label>CONFIRM PASSWORD</label>
        <input type="password" name="confirm_password" placeholder="Repeat password" required />
      </div>
      <button type="submit" class="btn-register">&#9658; CREATE MY ACCOUNT</button>
    </form>
    <p class="footer-link">Already have an account? <a href="/login">Login here</a></p>
  </div>
</div>
{% include "_scene.html" %}
{% include "_card_fx.html" %}
</body>
</html>
