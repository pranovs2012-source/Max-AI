<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Max AI - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000010;overflow:hidden;width:100vw;height:100vh;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;}

.form-wrapper{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
}

.brand{
  text-align:center;margin-bottom:12px;
}
.brand h1{
  font-size:28px;font-weight:700;letter-spacing:4px;
  background:linear-gradient(135deg,#ff6a00,#cc44ff,#00ccff);
  background-clip:text;-webkit-text-fill-color:transparent;
  text-transform:uppercase;
}
.brand p{font-size:12px;color:rgba(200,160,255,0.5);letter-spacing:2px;margin-top:4px;}

.card{
  background:rgba(8,4,20,0.88);
  border:1px solid rgba(180,80,255,0.25);
  border-radius:18px;
  padding:36px 40px;
  width:360px;
  backdrop-filter:blur(12px);
  box-shadow:0 0 60px rgba(140,40,255,0.15),0 0 120px rgba(255,80,0,0.05);
  animation:fadeUp 0.8s ease both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}

.card h2{
  color:rgba(220,180,255,0.9);
  font-size:18px;font-weight:500;
  text-align:center;margin-bottom:24px;
  letter-spacing:2px;
}

.error-msg{
  background:rgba(255,50,50,0.1);
  border:1px solid rgba(255,50,50,0.3);
  border-radius:8px;padding:10px 14px;
  color:#ff8888;font-size:13px;
  margin-bottom:16px;text-align:center;
}

.field{margin-bottom:14px;}
.field label{
  display:block;font-size:12px;
  color:rgba(200,160,255,0.6);
  letter-spacing:1px;margin-bottom:6px;
}
.field input{
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(180,80,255,0.2);
  border-radius:10px;
  padding:12px 16px;
  color:#e8d5ff;font-size:14px;
  outline:none;
  transition:border-color 0.3s,background 0.3s,box-shadow 0.3s;
}
.field input:focus{
  border-color:rgba(180,80,255,0.6);
  background:rgba(180,80,255,0.06);
  box-shadow:0 0 0 3px rgba(180,80,255,0.1);
}
.field input::placeholder{color:rgba(180,130,220,0.3);}

.btn-login{
  width:100%;
  background:linear-gradient(135deg,#8800cc,#cc4400);
  border:none;border-radius:10px;
  padding:13px;
  color:#fff;font-size:15px;font-weight:600;
  cursor:pointer;letter-spacing:1px;
  margin-top:8px;
  transition:opacity 0.2s,transform 0.1s;
  position:relative;overflow:hidden;
}
.btn-login:hover{opacity:0.88;}
.btn-login:active{transform:scale(0.98);}
.btn-login::after{
  content:'';position:absolute;top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
  animation:shimmer 2s infinite;
}
@keyframes shimmer{to{left:100%;}}

.divider{
  display:flex;align-items:center;gap:10px;
  margin:18px 0;
}
.divider span{flex:1;height:1px;background:rgba(180,80,255,0.15);}
.divider p{color:rgba(180,130,220,0.4);font-size:12px;}

.btn-google{
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(180,80,255,0.2);
  border-radius:10px;padding:12px;
  color:rgba(220,190,255,0.8);
  font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:background 0.2s,border-color 0.2s;
}
.btn-google:hover{background:rgba(180,80,255,0.08);border-color:rgba(180,80,255,0.4);}
.btn-google svg{width:18px;height:18px;}

.footer-link{
  text-align:center;margin-top:20px;
  font-size:13px;color:rgba(180,130,220,0.5);
}
.footer-link a{color:#cc66ff;text-decoration:none;font-weight:500;}
.footer-link a:hover{text-decoration:underline;}

</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="form-wrapper">
  <div class="brand">
    <h1>Max AI</h1>
    <p>Powered by Ancient Dragon Magic</p>
  </div>

  <div class="card">
    <h2>&#9670; ENTER THE REALM &#9670;</h2>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="field">
        <label>EMAIL ADDRESS</label>
        <input type="email" name="email" placeholder="your@email.com" required />
      </div>
      <div class="field">
        <label>PASSWORD</label>
        <input type="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-login">&#9658; ENTER MAX AI</button>
    </form>

    <div class="divider">
      <span></span><p>OR</p><span></span>
    </div>

    <button class="btn-google" onclick="handleGoogleLogin()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <p class="footer-link">No account? <a href="/register">Create one free</a></p>
  </div>
</div>

{% include "_scene.html" %}
{% include "_card_fx.html" %}
<script>
function handleGoogleLogin(){
  alert('Google OAuth coming soon! Use email/password for now.');
}
</script>
</body>
</html>
