name: Train MaxGPT

# Trains Max AI's own language model on GitHub's machines, in up to three chained stages:
# builds the corpus (Dolly + SQuAD + Max's conversations), trains with PyTorch, grades each
# stage with tools/model_eval.py and commits the weights whenever they beat the current model.
# Run it from the Actions tab -> "Train MaxGPT" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Model size: base, large or xl"
        default: "large"
      stage1_minutes:
        description: "Minutes of training in stage 1"
        default: "150"
      stage2_minutes:
        description: "Minutes in stage 2 (0 = stop after stage 1)"
        default: "170"
      stage3_minutes:
        description: "Minutes in stage 3 (0 = stop after stage 2)"
        default: "170"

concurrency:
  group: train-maxgpt
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Build the corpus
        working-directory: Max.AI
        run: |
          python -m maxgpt.knowledge
          python -m maxgpt.corpus --out ../corpus
          rm -rf ../corpus/downloads
      - uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: corpus
          retention-days: 7

  stage1:
    needs: corpus
    uses: ./.github/workflows/train-stage.yml
    with:
      stage: 1
      resume: false
      preset: ${{ inputs.preset }}
      minutes: ${{ fromJSON(inputs.stage1_minutes) }}
      total_minutes: ${{ fromJSON(inputs.stage1_minutes) + fromJSON(inputs.stage2_minutes) + fromJSON(inputs.stage3_minutes) }}

  stage2:
    needs: stage1
    if: inputs.stage2_minutes != '0'
    uses: ./.github/workflows/train-stage.yml
    with:
      stage: 2
      preset: ${{ inputs.preset }}
      minutes: ${{ fromJSON(inputs.stage2_minutes) }}
      total_minutes: ${{ fromJSON(inputs.stage1_minutes) + fromJSON(inputs.stage2_minutes) + fromJSON(inputs.stage3_minutes) }}

  stage3:
    needs: stage2
    if: inputs.stage3_minutes != '0'
    uses: ./.github/workflows/train-stage.yml
    with:
      stage: 3
      preset: ${{ inputs.preset }}
      minutes: ${{ fromJSON(inputs.stage3_minutes) }}
      total_minutes: ${{ fromJSON(inputs.stage1_minutes) + fromJSON(inputs.stage2_minutes) + fromJSON(inputs.stage3_minutes) }}
