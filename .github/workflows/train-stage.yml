name: Train MaxGPT stage

# One training stage (GitHub jobs can run for at most 6 hours). Called by train-maxgpt.yml.
on:
  workflow_call:
    inputs:
      stage: {type: number, required: true}
      minutes: {type: number, required: true}
      total_minutes: {type: number, required: true}
      preset: {type: string, default: large}
      resume_from: {type: string, default: "", description: "artifact of the previous stage"}

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy and PyTorch (CPU)
        run: |
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: corpus
          path: corpus
      - uses: actions/download-artifact@v4
        if: inputs.resume_from != ''
        with:
          name: ${{ inputs.resume_from }}
          path: ckpt
      - name: Train for ${{ inputs.minutes }} minutes
        working-directory: Max.AI
        run: |
          python -m maxgpt.train_torch --corpus ../corpus --out ../ckpt --preset ${{ inputs.preset }} \
            --minutes ${{ inputs.minutes }} --total-minutes ${{ inputs.total_minutes }} \
            ${{ inputs.resume_from != '' && '--resume' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint-${{ inputs.stage }}
          path: ckpt
          retention-days: 7
      - name: Grade the new model
        working-directory: Max.AI
        run: |
          python -m maxgpt.knowledge
          python tools/model_eval.py ../ckpt
      - name: Install it as the reader if it reads search results better
        run: |
          # The main chat model stays as it is; a trained model only replaces the reader, which writes
          # answers from web results, and only when it reads them better than the installed one.
          # Compare with the reader on main right now (an earlier stage may have installed one).
          git fetch -q origin "${GITHUB_REF_NAME}"
          git checkout -q -B publish "origin/${GITHUB_REF_NAME}"
          new=$(python -c "import json;print(json.load(open('ckpt/eval.json'))['reading'])")
          old=$(python -c "import json,os;p='Max.AI/maxgpt/checkpoints_reader/eval.json';print(json.load(open(p)).get('reading', 0) if os.path.exists(p) else 0)")
          echo "new reading score $new, installed reader $old"
          if python -c "import sys;sys.exit(0 if $new > $old else 1)"; then
            mkdir -p Max.AI/maxgpt/checkpoints_reader
            cp ckpt/maxgpt.npz ckpt/tokenizer.json ckpt/meta.json ckpt/eval.json Max.AI/maxgpt/checkpoints_reader/
            git config user.name "maxgpt-trainer[bot]"
            git config user.email "maxgpt-trainer@users.noreply.github.com"
            git add Max.AI/maxgpt/checkpoints_reader
            git commit -q -m "MaxGPT reader from stage ${{ inputs.stage }}: reading $new (was $old) [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || { git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; }
          else
            echo "Keeping the current reader."
          fi
